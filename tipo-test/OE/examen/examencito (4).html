        }

            border-radius: 8px;
            padding: 15px;

            background-color: #e9ecef;
        }

            margin-right: 12px;
        }

            background-color: #cfe2ff;
            border-color: #b6d4fe;
        }

            background-color: #d1e7dd;
            border-color: #a3cfbb;
        }

            background-color: #f8d7da;
            border-color: #f1aeb5;
        }

            padding: 15px;

            font-weight: bold;
            text-align: center;
        }

            background-color: #d1e7dd;
            color: #0a3622;
        }

        .feedback-incorrect {
            background-color: #f8d7da;
            color: #58151c;
        }

            margin-top: 30px;
            text-align: right;

            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;

const questionTextEl = document.getElementById('question-text');
const optionsContainerEl = document.getElementById('options-container');
const feedbackEl = document.getElementById('feedback');
const submitBtn = document.getElementById('submit-btn');
const nextBtn = document.getElementById('next-btn');
const questionCounterEl = document.getElementById('question-counter');
const scoreTrackerEl = document.getElementById('score-tracker');
const mistakesTrackerEl = document.getElementById('mistakes-tracker');
const quizContainerEl = document.querySelector('.quiz-content');
const resultsContainerEl = document.getElementById('results-container');
const progressBarEl = document.getElementById('progress-bar');

let currentQuestionIndex = 0;
let score = 0;
let correctAnswers = 0;
let incorrectAnswers = 0;

function loadQuestion() {
    feedbackEl.innerHTML = '';
    feedbackEl.className = '';
    const currentQuestion = quizData[currentQuestionIndex];
    questionTextEl.innerText = currentQuestion.question;
    optionsContainerEl.innerHTML = '';

    currentQuestion.options.forEach(option => {
        const optionId = `option-${Math.random().toString(36).substr(2, 9)}`;
        const label = document.createElement('label');
        label.className = 'option-label';
        label.htmlFor = optionId;

        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'option';
        radio.value = option;
        radio.id = optionId;
        
        radio.addEventListener('change', () => {
            document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
            label.classList.add('selected');
        });

        label.appendChild(radio);
        label.appendChild(document.createTextNode(option));
        optionsContainerEl.appendChild(label);
    });

    questionCounterEl.innerText = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;
    scoreTrackerEl.innerText = `Aciertos: ${correctAnswers}`;
    mistakesTrackerEl.innerText = `Fallos: ${incorrectAnswers}`;
    progressBarEl.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;
    
    submitBtn.style.display = 'inline-block';
    nextBtn.style.display = 'none';
    submitBtn.disabled = false;
}

function showResults() {
    quizContainerEl.style.display = 'none';
    resultsContainerEl.style.display = 'block';
    progressBarEl.style.width = '100%';

    // Asegurarse de que la nota no sea negativa
    const finalScore = Math.max(0, score).toFixed(2);
    
    document.getElementById('final-score').innerText = `Nota Final: ${finalScore} / 10.00`;
    document.getElementById('correct-count').innerText = `Total de aciertos: ${correctAnswers}`;
    document.getElementById('incorrect-count').innerText = `Total de fallos: ${incorrectAnswers}`;
}

submitBtn.addEventListener('click', () => {
    const selectedOption = document.querySelector('input[name="option"]:checked');
    if (!selectedOption) {
        alert('Por favor, selecciona una opción.');
        return;
    }

    const answer = selectedOption.value;
    const currentQuestion = quizData[currentQuestionIndex];
    const isCorrect = answer === currentQuestion.correctAnswer;
    
    // Deshabilitar todas las opciones
    document.querySelectorAll('input[name="option"]').forEach(input => {
        input.disabled = true;
    });

    if (isCorrect) {
        correctAnswers++;
        score += 0.25;
        feedbackEl.textContent = '¡Correcto!';
        feedbackEl.className = 'feedback-correct';
        selectedOption.parentElement.classList.add('correct');
    } else {
        incorrectAnswers++;
        score -= (0.25 / 3);
        feedbackEl.innerHTML = `Incorrecto. <br>La respuesta correcta es: <strong>${currentQuestion.correctAnswer}</strong>`;
        feedbackEl.className = 'feedback-incorrect';
        selectedOption.parentElement.classList.add('incorrect');
        // También resaltar la correcta
        document.querySelectorAll('input[name="option"]').forEach(input => {
            if (input.value === currentQuestion.correctAnswer) {
                input.parentElement.classList.add('correct');
            }
        });
    }

    scoreTrackerEl.innerText = `Aciertos: ${correctAnswers}`;
    mistakesTrackerEl.innerText = `Fallos: ${incorrectAnswers}`;
    submitBtn.style.display = 'none';
    nextBtn.style.display = 'inline-block';
    
    if (currentQuestionIndex === quizData.length - 1) {
        nextBtn.textContent = 'Ver Resultados';
    }
});

nextBtn.addEventListener('click', () => {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
});

// Iniciar el quiz
loadQuestion();
</script>
